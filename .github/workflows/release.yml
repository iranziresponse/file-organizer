name: Build and release Orch-Setup.exe

# Push a tag like v1.0.0 to build the exe and attach it to a new GitHub
# Release. workflow_dispatch lets you run the same build on demand (from
# the Actions tab) without cutting a release, useful for testing the build
# itself before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities
        # Fails the build (and blocks the release) if any installed
        # dependency has a known CVE -- matches the release checklist a
        # user-facing exe deserves: don't ship a known-vulnerable library
        # just because the app code itself passed its tests.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run test suite
        run: python manage.py test

      - name: Build Orch
        # Orch.spec builds a onedir layout (dist\Orch\Orch.exe plus its
        # _internal support folder) rather than a single-file exe -- a
        # onefile build has to re-extract its whole bundle on every single
        # launch, slow enough that Windows can show a blank "ghost"
        # placeholder window until the real one finishes loading. onedir
        # only extracts once, at install time below, not on every run.
        run: pyinstaller --clean --noconfirm Orch.spec

      - name: Verify bundle contains no per-user data
        shell: pwsh
        run: |
          $forbidden = @(
            "db.sqlite3",
            "db.sqlite3-shm",
            "db.sqlite3-wal",
            "secret_config.json",
            "ai_config.json",
            "youtube_config.json",
            "drive_config.json",
            "support_email.json",
            "orch-owner.json",
            "owner_config.json",
            "credentials.json",
            "token.json",
            "_config.json",
            "_curriculum_map.json",
            ".autostart_initialized"
          )
          $bundle = Get-ChildItem -LiteralPath "dist\Orch" -Recurse -File |
            Where-Object { $forbidden -contains $_.Name }
          if ($bundle) {
            $paths = ($bundle | ForEach-Object { $_.FullName }) -join ", "
            throw "Refusing to package Orch because the bundle contains per-user state: $paths"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Download Microsoft Edge WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist_installer | Out-Null
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "dist_installer\MicrosoftEdgeWebView2Setup.exe"

      - name: Determine the version to stamp on the installer
        id: version
        # Only a real tag push (a real release) gets the actual version
        # number; a manual workflow_dispatch run (testing the build itself
        # before tagging, see the trigger comment above) leaves it unset,
        # and installer/Orch.iss's own #ifndef falls back to a harmless
        # placeholder version instead.
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            echo "define=/DMyAppVersion=$version" >> $env:GITHUB_OUTPUT
          } else {
            echo "define=" >> $env:GITHUB_OUTPUT
          }

      - name: Build the installer
        # installer/Orch.iss packages dist\Orch into a normal Next-Next-
        # Install wizard (Orch-Setup.exe) instead of a bare exe or a zip a
        # non-technical student has to unzip themselves.
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ${{ steps.version.outputs.define }} installer\Orch.iss'
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: Orch-windows
          path: dist_installer\Orch-Setup.exe

      - name: Attach to release
        # The README and the landing page's download button both point
        # directly at .../releases/latest/download/Orch-Setup.exe.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist_installer\Orch-Setup.exe
          generate_release_notes: true
